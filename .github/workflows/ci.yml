name: CI

on:
  push:
    branches: [main]
  pull_request:
  # main merges through a merge queue; required checks must also report on the
  # queued merge commit, or the queue waits on them until it times out.
  merge_group:

# Least privilege by default: read-only token; jobs inherit unless they declare more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true

      # The gate's npm-test step runs on the same Node 24 line as npm-release.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Restore the pinned dev tools instead of `go install`-ing them every run.
      # Keyed on the exact pinned versions, so a pin bump misses and rebuilds clean.
      - name: Cache pinned tools (./bin)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-${{ runner.os }}-${{ hashFiles('.config/tool-versions') }}

      - name: Bootstrap pinned tools
        run: ./scripts/bootstrap.sh

      - name: Run the gate
        run: ./scripts/verify.sh

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # Additive cross-platform safety net for the distribution targets — NOT a redefinition
  # of the single gate above. Validates that the darwin archives the release ships build
  # and pass race tests.
  build-test:
    name: build-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Build
        run: go build ./...
      - name: Test (race)
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"

  # Validate the release config on every PR so a tag push can't surface a broken pipeline.
  # Signing/SBOM need cosign/syft/OIDC and are exercised only by the real release job.
  # Build cache is disabled here: this job produces release-like snapshot artifacts, so a
  # poisonable cache must not feed it (zizmor cache-poisoning). Integrity > speed.
  release-dryrun:
    name: release-dryrun
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: GoReleaser snapshot (no publish)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom

  # Isolated npm-channel signal (spec 019 FR-015): the same script also runs
  # inside the verify job's gate — this clearly-labeled job exists so an npm
  # failure is distinguishable at a glance, additive like build-test. Node is
  # pinned to the same 24 line as verify and npm-release.yml.
  npm-test:
    name: npm-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Run npm channel tests
        run: ./scripts/npm-test.sh

  # Static analysis of the workflows themselves: actionlint (correctness) + zizmor
  # (security, incl. hash-pin enforcement). Same invocation as scripts/audit-workflows.sh.
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Cache pinned tools (./bin)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: bin-${{ runner.os }}-${{ hashFiles('.config/tool-versions') }}
      - name: Bootstrap pinned tools
        run: ./scripts/bootstrap.sh
      - name: Set up uv (for uvx zizmor)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Audit workflows
        run: ./scripts/audit-workflows.sh

  # Documentation site: fail if the README install region drifted from
  # docs/installation.md, regenerate the content from docs/, build it with link
  # and anchor validation, and run the landing page example against the gskill
  # built from this commit. Additive like build-test; publishing is pages.yml.
  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install site dependencies
        run: npm ci --prefix website
      - name: Check, build, and run the landing example
        run: ./scripts/site.sh check

  # Container image: build both platforms with ko, then load this runner's
  # platform into Docker and run the smoke suite as the runner user
  # (scripts/image.sh check). Pushes nothing and needs no secrets, so forked
  # PRs run it too. Additive like build-test; publishing is image-release.yml.
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      # Not the ./bin cache: its key has no architecture, so the arm64 leg
      # would restore amd64 binaries.
      - name: Install ko
        run: |
          source scripts/lib.sh
          go install "github.com/google/ko@$(tool_version KO)"
      - name: Build both platforms and smoke-test this one
        run: ./scripts/image.sh check

  # Upgrades a build of this commit, injected as release 0.8.0, to the live
  # latest release on every release platform: the real archive, the real Sigstore
  # signature, and the real TUF root (spec 031 SC-001). It reads public release
  # data only; the token just lifts the API rate limit.
  self-upgrade-e2e:
    name: self-upgrade-e2e (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-latest
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read # checkout only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: true
      - name: Upgrade a 0.8.0 build to the latest release
        run: go test -tags=e2e ./test/e2e/ -run SelfUpgrade -v
        env:
          GSKILL_E2E: "1"
          GITHUB_TOKEN: ${{ github.token }}
